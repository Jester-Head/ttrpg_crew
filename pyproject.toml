[project]
name = "ttrpg_crew"
version = "0.1.0"
description = "CrewAI TTRPG"
requires-python = ">=3.11,<3.13"
dependencies = [
    "crewai",
    "crewai-tools",
    "litellm",
    "pydantic",
    "python-dotenv",
    # Imported directly by the engine; also pulled in by crewai, but declared
    # here so a fresh install can't silently miss them.
    "chromadb",
    "jinja2",
    "pyyaml",
]

[project.optional-dependencies]
# Only for scripts/convert_srd.py (regenerating knowledge/rules/srd/ from the PDF).
srd = ["pymupdf"]

[project.scripts]
run_ttrpg = "ttrpg_crew.main:run"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"
