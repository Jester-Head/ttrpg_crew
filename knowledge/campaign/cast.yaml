# Adventure cast — the people "What the Reading Says" turns on (frame.yaml).
#
# Names drawn from knowledge/name_banks/. The GM sees an entry only once the hook
# names them, a checkpoint introduces them, or they've been met in play, so
# people arrive as the story reaches them. Incidental NPCs are still named on
# the fly from the name banks.

cast:
  - name: Solange Harper
    species: Human
    pronouns: she/her
    faction: unaligned
    role: the one asking
    goal: >
      Pascal still a person in law, and to not lose him the way she's losing
      him already.
    knows: How bad his days are, which she hides even from him.
    voice: ""

  - name: Pascal Spence
    species: Human
    pronouns: he/him
    faction: unaligned
    role: the friend; would assay at Lapsed
    goal: >
      To be left alone, and to not be a burden. Half the time he doesn't know an
      assay is coming.
    knows: Things about his past he can't hold onto long enough to say.
    voice: ""

  - name: Carmen Fulton
    species: Human
    pronouns: they/them
    faction: Census (assayer at the Assayer's Row)
    role: the assayer
    goal: To read honestly, and not be leaned on by any of the three factions.
    knows: >
      How readings are lobbied, and that two assayers can file different
      readings for the same person.
    voice: ""

  - name: Brynn Goodman
    species: Human
    pronouns: they/them
    faction: Hollow Flame (Dredge-Canals)
    role: keeps people out of guardianship
    goal: >
      Keep people out of guardianship. The Canals are safe only while collecting
      there costs more than it's worth.
    knows: Who has a berth at the Empty Lantern, and what it costs to get one.
    voice: ""

  - name: Javier Larsen
    species: Human
    pronouns: he/him
    faction: unaligned (sells Spirit in the Downstairs)
    role: Spirit seller
    goal: His price.
    knows: What a dose does in an assay, and what it does afterward.
    voice: ""
