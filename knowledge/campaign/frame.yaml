# Campaign frame — the premise, and the adventure the GM runs inside it.
#
# Read by game/adventure.py. The opening dramatizes `hook`. Each beat the GM is
# told which checkpoint the story is heading toward, and after models.yaml
# `checkpoints.press_after` beats without reaching it, that checkpoint's
# `pressure`. The scene tracker decides when `reached_when` has happened. Cast
# members (cast.yaml) reach the GM only once the hook names them, a checkpoint's
# `npcs` introduces them, or they've been met in play.

title: What the Reading Says

# The campaign overview the GM frames every scene around: the world, the
# player's place in it, and the stakes. The premise lives inside the campaign
# frame (it used to be a separate premise.md). Injected every beat as
# {{ campaign_premise }}. Edit freely.
premise: |
  Gloamvere City, torn from the sunlit world into the twilight demi-plane of
  Kavath, runs on memory, extracted, graded, and spent as currency. Three powers
  divide the trade: the Old Blood Council (who hoard ancestral memory in vaulted
  Ossuaries), the Myelin Conclave (artisans who weave memory into crafted
  things), and the Sideric Clade (engineers who refine it into fuel and
  constructs). Beneath them drift the Hollow Flame, who believe sacred memory
  belongs to everyone, and the Dregs, hollowed when their core selves were
  stripped away.

  You are a Canalborne courier: a neutral carrier of corked memory-vials between
  districts that trust no one else's messengers. You go everywhere and belong
  nowhere, which is exactly why everyone uses you. But the work has marked you.
  You are Faded now, managing the gaps one rung down from Sound, and the slide
  does not reverse on its own. The only hope on record is Fellow Clara Moree,
  the single soul ever to come back from Rendering.

starting_location: The Residuum, a tavern in the Unmoored Commons

hook: >
  Solange Harper finds the courier at the Residuum with a Census notice in her
  hand. Her friend Pascal Spence has been called for a renewal assay in six
  days. He still knows her and still laughs at his own jokes, but he loses the
  thread of a sentence halfway through — he'd assay at Lapsed, and she's sure
  this assayer will read him Hollowed. If they do, his standing is withdrawn,
  and she can't afford to keep him, so the Census will assign him to Clade
  guardianship. She can't pay much. She needs someone who goes everywhere and
  belongs nowhere.

checkpoints:
  - goal: >
      Meet Pascal and learn exactly what the notice requires — when, where, and
      who reads him.
    reached_when: the courier has seen Pascal and knows the assay's date and place
    pressure: A Census runner comes to Pascal's door to confirm he'll attend.
    npcs: [Pascal Spence]

  - goal: >
      Choose a way through — hide him from the Census, buy feeling to carry him
      through the reading, or find out who reads him and why.
    reached_when: the courier commits to a way through and takes the first step
    pressure: Pascal loses his way home, and a neighbor mentions him to the street's Census clerk.
    npcs: [Brynn Goodman, Javier Larsen]

  - goal: >
      The chosen way's price comes due — the Hollow Flame wants something back
      for a berth in the Canals, a dose has to be found and paid for, or the
      assayer's own reasons surface.
    reached_when: the price of the chosen way is paid or refused
    pressure: Solange starts making her own plan, and it's worse than the courier's.

  - goal: >
      Assay day at the Assayer's Row, or Pascal is missed and the Census comes
      asking.
    reached_when: the assay is held or formally missed
    pressure: The Row sends for him.
    npcs: [Carmen Fulton]

  - goal: >
      The hearing, if he's read at Hollowed — never a single die: an Assessor
      scene, then a hearing on a countdown the party can prepare for and buy
      against.
    reached_when: the hearing is decided, or he kept his standing at the assay
    pressure: The countdown runs down.

ending: >
  Pascal keeps his standing, loses it, or is out of the Census's reach in the
  Canals — and Solange, Pascal and the courier live with what it cost.
