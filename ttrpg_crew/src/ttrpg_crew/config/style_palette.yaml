# Register cues for the GM — YOUR vocabulary, categorized so words land in
# the right lane.
#
# Each beat a few groups are sampled from every category WITH the category
# label attached, e.g.  sound: tolling / creak;  smell: tar / river rot
# That label is what stops a model from using a word in the wrong sense
# (the "dirge-like scent" failure: a sound word applied to a smell).
#
# Structure:
#   - Top-level keys are categories. They can nest (sensory -> the five
#     senses); the LEAF key becomes the label the model sees, so name leaves
#     for how the word is used.
#   - A leaf holds a list. Each item is either a group of interchangeable
#     synonyms ([dim, unlit, half-dark]) or a single phrase ("rain ticking
#     on the gutters").
#   - Empty categories inject nothing; an empty palette means the GM just
#     writes plainly. Delete or add categories freely — nothing is hardcoded
#     to these names.
#   - models.yaml sampling.style_cues_per_category controls how many groups
#     are drawn from each leaf per beat; with many filled leaves, keep it
#     at 1-2 so the cue line stays short.
#
# Live-editable: changes apply on the next beat, no restart.
#
# Examples of the shapes (replace with your own; these are placeholders, not
# suggestions):
#   adjectives:
#     - [dim, unlit, half-dark]
#   verbs:
#     - [mutters, grumbles, says low]
#   phrases:
#     - "rain ticking on the gutters"
#   sensory:
#     sound:
#       - [tolling, creak of ropes]
#     smell:
#       - [tar, river rot]

adjectives: []

verbs: []

phrases: []

sensory:
  sight: []
  sound: []
  smell: []
  taste: []
  touch: []
