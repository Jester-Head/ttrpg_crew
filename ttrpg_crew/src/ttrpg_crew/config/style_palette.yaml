    - "The room grew inexplicably colder."
    - "A phantom's touch, cold as ice."
    - "An unseen force gripped with icy fingers."
    - "The air turned cold with the presence of the unknown."
  dread phrases:
    - "A presence felt, yet unseen."
    - "The air was thick with unease."
    - "The night was alive with unknown horrors."
    - "A sense of impending doom hung heavily."
    - "An unspeakable horror awaited in the shadows."
    - "The walls seemed to close in."
    - "An inescapable sense of being followed."
    - "A pall of dread settled over everything."
    - "An eerie calm before the storm."
    - "An ancient evil stirred in the depths."
    - "The air crackled with a sinister energy."
    - "The night whispered secrets of dread."
    - "The fabric of reality seemed to tear."
    - "An unspeakable entity lurked in the dark."
    - "The night air was heavy with foreboding."
    - "The stillness was unnaturally pervasive."
    - "The clock ticked towards an unknown doom."
    - "A lurking dread filled the empty streets."
    - "An echo of a forgotten nightmare resurfaced."
    - "Unseen terrors lurked in the shadows."
    - "The air was filled with a palpable dread."
    - "A sense of doom hung heavily in the air."
    - "The walls dripped with an indescribable horror."
    - "A cursed object emanated malevolence."

sensory:
  sight:
    - [lurid]
  sound: []
  smell:
    - [fetid]
  taste: []
  touch: []
