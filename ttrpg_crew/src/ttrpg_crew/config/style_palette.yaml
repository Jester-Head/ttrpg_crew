    - "Eyes, glowing with malice, watched."
    - "A ghastly visage appeared in the mirror."
    - "A grotesque shadow slithered across the wall."
    - "The darkness devoured all light."
    - "A foreboding figure stood at the edge of sight."
    - "A ghostly pallor enveloped the room."
    - "The moon cast a baleful glow."
    - "An oppressive darkness smothered all light."
    - "Claw marks scarred the old wood."
    - "A cadaverous figure approached, limping."
    - "A grotesque mockery of life moved in the shadows."
    - "A spectral light flickered in the distance."
    - "The darkness seemed to pulsate with malice."
    - "The light dimmed as if swallowed by darkness."
    - "Eyes watched from the darkness."
    - "Shadows moved of their own accord."
    - "A haunting figure stood at the edge of vision."
    - "The ground was soaked with ancient blood."
    - "A ghostly figure appeared in the mirror."
    - "The light flickered as if signaling the presence of spirits."
    - "A grotesque shadow stretched across the wall."
  sound phrases:
    - "The silence screamed louder than any cry."
    - "Eerie whispers filled the room."
    - "The wind howled like the cries of the damned."
    - "A scream shattered the silence."
    - "The floorboards groaned with secrets."
    - "A sinister laugh echoed in the distance."
    - "A death-like chortle originated from under the bed."
    - "The door creaked open by unseen hands."
    - "A muffled cry came from nowhere."
    - "The sound of dragging feet approached."
    - "A blood-curdling shriek pierced the night."
    - "The echo of footsteps in the abandoned hall."
    - "The very walls seemed to moan in despair."
    - "A demonic chuckle resonated in the gloom."
    - "A sepulchral voice spoke from the darkness."
    - "Fingers of terror drummed a rhythm of death outside the door."
    - "An ungodly shriek echoed through the night."
    - "A bone-chilling whisper in the darkness."
    - "An otherworldly scream shattered the silence."
    - "The echo of footsteps followed, but no one was there."
    - "A demonic laugh echoed in the empty room."
    - "A haunting melody played from nowhere."
    - "A sinister whisper called out from the darkness."
  smell phrases:
