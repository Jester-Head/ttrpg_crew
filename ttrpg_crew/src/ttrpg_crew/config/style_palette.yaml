# Register cues for the GM — YOUR vocabulary, categorized so words land in
# the right lane.
#
# Each beat a few groups are sampled from every category WITH the category
# label attached, e.g.  sound: tolling / creak;  smell: tar / river rot
# That label is what stops a model from using a word in the wrong sense
# (the "dirge-like scent" failure: a sound word applied to a smell).
#
# Structure:
#   - Top-level keys are categories. They can nest (sensory -> the five
#     senses); the LEAF key becomes the label the model sees, so name leaves
#     for how the word is used.
#   - A leaf holds a list. Each item is either a group of interchangeable
#     synonyms ([dim, unlit, half-dark]) or a single phrase ("rain ticking
#     on the gutters").
#   - Empty categories inject nothing; an empty palette means the GM just
#     writes plainly. Delete or add categories freely — nothing is hardcoded
#     to these names.
#   - models.yaml sampling.style_cues_per_category controls how many groups
#     are drawn from each leaf per beat; with many filled leaves, keep it
#     at 1-2 so the cue line stays short.
#
# Live-editable: changes apply on the next beat, no restart.

nouns:
  - [abomination]
  - [deviance]
  - [wretch]

adjectives:
  # revulsion / disgust
  - [abhorrent, loathsome, repugnant, repulsive, revolting, sickening, vile]
  # horror / dread
  - [appalling, chilling, fearsome, ghastly, horrendous, horrific, horrifying, nightmarish]
  # gore (visual violence)
  - [gory, grisly, gruesome]
  # death-tinged
  - [ghoulish, macabre, morbid]
  # evil intent
  - [devilish, malevolent, malignant, nefarious, sinister]
  # cruelty
  - [hateful, savage, vicious]
  # wrongness / deformity
  - [demented, deviant, grotesque, monstrous, twisted, unnatural]
  # temperament / mood (people, not places)
  - [brooding, grim, irascible]

verbs:
  - [maim]
  - [torment]

# Full-sentence inspiration, laned like the word cues. The GM is told these
# are SHAPES to adapt (person/tense/details), never to paste verbatim.
# Keep these impersonal (no "you"/"your"): second-person phrases prime the GM
# to narrate the player's sensations — the player_puppeteering failure. Those
# live in style_palette_reserved.yaml for a future NPC/companion cue system.
phrases:
  sight phrases:
    - "Shadows danced on the walls."
    - "The darkness seemed to breathe."
    - "Unseen eyes watched from the shadows."
    - "The light flickered, then died."
