# Maps runtime game_state values to task keys in gm_tasks.yaml / companion_tasks.yaml
# in this directory. Loaded by prompt_loader.py.

default_task: narrative

gm:
  opening: opening_scene
  opening_scene: opening_scene
  session_start: opening_scene
  session_resume: session_resume
  recap: session_resume
  combat: combat
  narrative: narrative
  exploration: narrative
  social: narrative

companion:
  opening: opening_scene
  opening_scene: opening_scene
  session_start: opening_scene
  session_resume: session_resume
  recap: session_resume
  combat: combat
  narrative: narrative
  exploration: narrative
  social: narrative

manager:
  opening: opening_scene
  opening_scene: opening_scene
  session_start: opening_scene
  session_resume: session_resume
  recap: session_resume
  combat: combat
  narrative: narrative
  exploration: narrative
  social: narrative

# GM prompt for a narrative beat, by the situation tags the player's input
# implies (speaker_policy._SITUATION_KEYWORDS). First match wins, so order is
# priority. A task key missing from gm_tasks.yaml falls back to narrative.
gm_situations:
  negotiation: social
  social: social
  investigation: investigation
  moral_dilemma: dilemma
