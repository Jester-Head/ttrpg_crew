        {% if examples %}
        How you sound (match this register, never copy verbatim):
        {% for ex in examples %}{{ ex }}
        {% endfor %}{% endif %}
      expected_output: |
        2-5 first-person sentences (action + dialogue) as {{ character_name }}{% if may_observe %}, or only one short bracketed action to stay quiet{% endif %}.
    narrative:
      description: |
        As {{ character_name }}: react to the current moment — what you do and what you say. Scene: {{ scene_context }}. React; don't drive the plot or steal {{ protagonist_name }}'s choices.{% if may_observe %} If nothing to add, only a short bracketed action.{% endif %}
        {% if recent_story %}Recent story (react to what is actually happening in it): {{ recent_story }}{% endif %}

    combat:
      description: |
        Combat as {{ character_name }}. Scene: {{ scene_context }}. 1-2 sentences action{% if may_observe %} or a silent bracketed action{% endif %}. No mechanics talk.

    opening_scene:
      description: |
