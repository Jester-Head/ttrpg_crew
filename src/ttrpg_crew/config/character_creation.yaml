# Character creation options and prompts.
#
# Ported from the previous (AutoGen) version's data/character_creation.yaml.
# The old `factions:` list (Vestige Assembly, Eternal Ember, Cognition
# Collective, etc.) predated the current lore entirely and has been replaced
# with the four factions of current canon. Ancestries extended to cover every
# ancestry the name banks support. Not yet wired into code — an interactive
# character-creation flow is future work; until then this documents the
# option space the protagonist sheet (knowledge/protagonist.yaml) draws from.

classes:
  - key: bard
    name: Bard
    description: "Charismatic performer, inspires allies"
  - key: druid
    name: Druid
    description: "Nature magic, shapeshifting"
  - key: guardian
    name: Guardian
    description: "Defensive tank, protects allies"
  - key: ranger
    name: Ranger
    description: "Ranged combat, tracking"
  - key: rogue
    name: Rogue
    description: "Stealth, precision strikes"
  - key: seraph
    name: Seraph
    description: "Divine magic, healing"
  - key: sorcerer
    name: Sorcerer
    description: "Raw magical power"
  - key: warrior
    name: Warrior
    description: "Martial combat expert"
  - key: wizard
    name: Wizard
    description: "Studied arcane magic"

