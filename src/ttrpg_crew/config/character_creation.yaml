personality_prompts:
  - field: personality_strength
    prompt: "Core strength (brave, clever, kind, etc.):"
  - field: personality_flaw
    prompt: "Main flaw (hot-headed, naive, secretive, etc.):"
  - field: desire
    prompt: "What do you want most?"
  - field: fear
    prompt: "What do you fear most?"
  - field: speech_style
    prompt: "How do you speak? (formal, slang, quiet, etc.):"
  - field: quirk
    prompt: "A quirk or habit:"

# Current canon factions (the old list — Vestige Assembly, Weaver's Conclave,
# Eternal Ember, Cognition Collective — predates the lore rewrite).
factions:
  - key: spiritus_conclave
    name: Spiritus Conclave
    description: "Religious order ministering to the dead and brokering memory as sacrament"
  - key: old_blood_council
    name: Old Blood Council
    description: "Aristocratic families hoarding ancestral memories in private vaults"
  - key: siderian_clade
    name: Siderian Clade
    description: "Industrial power refining memory into fuel and product"
  - key: hollow_flame
    name: The Hollow Flame
    description: "Hidden movement working against the memory trade from below"

kavath_hooks:
  "1":
    description: "Sold too many memories - can't remember childhood"
    text: "You sold too many memories and can't remember your childhood"
  "2":
    description: "Carry a debt in memories you can never repay"
    text: "You carry a debt in memories that you can never repay"
  "3":
    # TODO(canon): "True Name" predates the current lore — rule whether True
    # Names exist, or remap to a stolen/extracted Quintessa.
    description: "Family member's True Name was stolen"
    text: "A family member's True Name was stolen"
  "4":
    description: "Witnessed something terrible at a memory refinery"
    text: "You witnessed something terrible at a Siderian Clade refinery"
  "5":
    description: "The Veil speaks to you in dreams"
    text: "The Veil speaks to you in dreams"
  "6":
    description: "Being hunted by a faction"
    text: "You're being hunted by a faction"
    requires_input: "faction"
  "7":
    description: "Other (describe)"
    requires_input: "custom"

default_values:
  personality_strength: "Determined"
  personality_flaw: "Stubborn"
  desire: "Adventure"
  fear: "Failure"
  speech_style: "Direct"
  quirk: "Always ready for trouble"
  kavath_hook: "Seeking answers in Gloamvere's shadows"
